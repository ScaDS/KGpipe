# Example catalog for kgpipe.pipeline/v1.
# Tasks live in src/kgpipe_examples/dummy_tasks.py.
schema: kgpipe.pipeline/v1

dummy_auto:
    description: "Auto-connect source and seed through match, exchange, fuse, and type"
    connect: auto
    inputs:
        source: {role: source, format: nt}
        seed: {role: seed, format: nt}
    output:
        result: {role: result, format: nt}
    parameters:
        entity_matching_threshold: 0.7
    tasks:
        - name: dummy_match
          parameters:
              entity_matching_threshold: 0.99
        - dummy_exchange
        - dummy_fuse
        - dummy_type

dummy_explicit:
    description: "The same pipeline with every port written out"
    connect: explicit
    inputs:
        source: {role: source, format: nt}
        seed: {role: seed, format: nt}
    output:
        result: {role: result, format: nt}
    parameters:
        entity_matching_threshold: 0.7
    tasks:
        - id: dummy_match
          task: dummy_match
          parameters:
              entity_matching_threshold: 0.99
          inputs: {source: $source, kg: $seed}
          outputs: {output: dummy_match.output}
        - id: dummy_exchange
          task: dummy_exchange
          inputs: {input: dummy_match.output}
          outputs: {output: dummy_exchange.output}
        - id: dummy_fuse
          task: dummy_fuse
          inputs: {source: $source, kg: $seed, matches1: dummy_exchange.output}
          outputs: {output: dummy_fuse.output}
        - id: dummy_type
          task: dummy_type
          inputs: {source: dummy_fuse.output}
          outputs: {result: $result}

dummy_join_auto:
    description: "Two matchers of the same format. Auto-connect binds the newer file to json1"
    connect: auto
    inputs:
        source: {role: source, format: nt}
        seed: {role: seed, format: nt}
    output:
        result: {role: result, format: nt}
    tasks:
        - dummy_match
        - dummy_match
        - dummy_aggregate
        - dummy_fuse

dummy_join_explicit:
    description: "The same tasks, with json1 pinned to the first matcher"
    connect: explicit
    inputs:
        source: {role: source, format: nt}
        seed: {role: seed, format: nt}
    output:
        result: {role: result, format: nt}
    tasks:
        - id: entities
          task: dummy_match
          inputs: {source: $source, kg: $seed}
          outputs: {output: entities.output}
        - id: relations
          task: dummy_match
          inputs: {source: $source, kg: $seed}
          outputs: {output: relations.output}
        - id: join
          task: dummy_aggregate
          inputs: {json1: entities.output, json2: relations.output}
          outputs: {output: join.output}
        - id: fuse
          task: dummy_fuse
          inputs: {source: $source, kg: $seed, matches1: join.output}
          outputs: {output: $result}
